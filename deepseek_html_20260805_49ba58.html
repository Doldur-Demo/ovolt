<script>
// 🔑 DEMO ŞİFRESİ - Kendi belirlediğin şifreyi buraya yaz
const DEMO_PASSWORD = "doldur2026";

// Sayfa yüklenmeden önce şifre kontrolü yap
(function() {
    // Eğer daha önce doğru şifre girildiyse atla
    if (sessionStorage.getItem('demo_authorized') === 'true') {
        return;
    }

    const enteredPassword = prompt(
        '🔒 Bu demo özel bir müşteri içindir.\n' +
        'Lütfen size iletilen şifreyi girin:'
    );

    if (enteredPassword === DEMO_PASSWORD) {
        // Şifre doğru, oturum boyunca hatırla
        sessionStorage.setItem('demo_authorized', 'true');
    } else {
        // Şifre yanlış
        if (enteredPassword !== null) {
            alert('❌ Hatalı şifre! Demo\'ya erişim reddedildi.');
        }
        document.body.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;background:#0B1F33;color:white;text-align:center;padding:20px;flex-direction:column;">
                <h1 style="font-size:48px;margin:0;">🔒</h1>
                <h2 style="font-weight:400;">Özel Demo</h2>
                <p style="opacity:0.6;">Bu demo yalnızca şifresi olan kullanıcılar içindir.</p>
                <p style="opacity:0.4;font-size:12px;margin-top:30px;">Doldur &amp; ovolt · 2026</p>
            </div>
        `;
        throw new Error('Unauthorized');
    }
})();
</script>

<style>
  :root{
    --navy:#0B1F33;
    --deep:#0B3D5C;
    --teal:#1C7293;
    --mint:#2EC4B6;
    --orange:#FCAF17;
    --card:#F2F7F9;
    --card2:#EAF1F3;
    --ink:#16222B;
    --muted:#5B6B73;
    --white:#FFFFFF;
    --danger:#D0483E;
    --ok:#2E9E6D;
    --border:#E1EAED;
    --font-display:Cambria, Georgia, 'Times New Roman', serif;
    --font-body:Calibri, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-rounded: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
    --sidebar-w: 258px;
    /* real Doldur app tokens (sampled from production screenshots) */
    --ph-orange:#FD5003;
    --ph-green:#00B763;
    --ph-green-bg:#E1F6EC; --ph-green-text:#00A659;
    --ph-blue-bg:#E9F0FF; --ph-blue-text:#1E6FE0;
    --ph-pink-bg:#FEEBEB; --ph-pink-text:#F5484A;
    --ph-yellow:#F89300; --ph-yellow-bg:#FEF6D5;
    --ph-gray-bg:#EFEFEF; --ph-gray-text:#444;
    --ph-border:#ECECEC;
    --ph-muted:#9A9A9A;
    --ph-dark:#212121;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--card);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--mint);color:var(--navy);}
  :focus-visible{outline:2px solid var(--mint);outline-offset:2px;}

  /* ---------- layout shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:linear-gradient(180deg,var(--navy) 0%, #0d2740 100%);
    color:var(--white);
    display:flex;
    flex-direction:column;
    position:fixed;
    top:0;left:0;bottom:0;
    padding:26px 18px;
    z-index:50;
  }
  .brand-row{display:flex;align-items:center;gap:10px;padding:0 6px 22px 6px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:22px;}
  .brand-mark{width:30px;height:30px;flex-shrink:0;}
  .brand-word{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.2px;}
  .demo-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(0,120,254,.14);
    border:1px solid rgba(0,120,254,.4);
    color:#0078FE;
    font-size:10.5px;font-weight:700;letter-spacing:.6px;
    padding:6px 10px;border-radius:20px;
    margin:0 6px 24px 6px;
    text-transform:uppercase;
  }
  .demo-badge .dot{width:6px;height:6px;border-radius:50%;background:#0078FE;animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  .nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 12px;border-radius:10px;
    color:rgba(255,255,255,.72);
    font-size:14px;font-weight:600;
    border:1px solid transparent;
    border-left:3px solid transparent;
    transition:background .15s ease, color .15s ease;
    background:transparent;
    width:100%;text-align:left;
  }
  .nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:var(--white);}
  .nav-item.active{
    background:rgba(0,120,254,.16);
    color:var(--white);
    border-left:3px solid #0078FE;
  }
  .nav-item.active svg{opacity:1;color:#0078FE;}
  .nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.35);padding:16px 12px 6px 12px;font-weight:700;}

  .sidebar-footer{
    border-top:1px solid rgba(255,255,255,.1);
    padding-top:16px;margin-top:10px;
    font-size:11.5px;color:rgba(255,255,255,.45);
  }
  .sidebar-footer b{color:rgba(255,255,255,.75);}

  .main{
    margin-left:var(--sidebar-w);
    flex:1;
    padding:40px 46px 70px 46px;
    max-width:1360px;
  }

  .page{display:none;animation:fadeUp .38s ease;}
  .page.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .page-eyebrow{font-size:12.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mint);margin-bottom:8px;}
  .page-title{font-family:var(--font-display);font-size:32px;font-weight:700;color:var(--deep);margin:0 0 6px 0;}
  .page-subtitle{font-size:14.5px;color:var(--muted);margin:0 0 28px 0;max-width:720px;line-height:1.5;}

  /* ---------- stat cards ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
  .stat-card{
    background:var(--white);border:1px solid var(--border);border-radius:14px;
    padding:20px 20px 18px 20px;
  }
  .stat-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .stat-label{font-size:12px;color:var(--muted);font-weight:600;}
  .stat-value{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--deep);margin-top:6px;}
  .stat-live{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite;flex-shrink:0;margin-top:4px;}
  .stat-delta{font-size:11.5px;color:var(--ok);font-weight:700;margin-top:6px;}

  /* ---------- cards / panels ---------- */
  .panel{
    background:var(--white);border:1px solid var(--border);border-radius:16px;
    padding:24px 26px;
  }
  .panel-title{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 4px 0;}
  .panel-sub{font-size:12.5px;color:var(--muted);margin:0 0 18px 0;}
  .grid-60-40{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;}

  /* ---------- network bubble map ---------- */
  .bubble-wrap{display:flex;align-items:flex-end;gap:22px;justify-content:center;padding:30px 10px 10px 10px;flex-wrap:wrap;min-height:210px;}
  .bubble{
    position:relative;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #1c7293, #0b3d5c 70%);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    color:var(--white);cursor:default;
    transition:transform .2s ease;
    box-shadow:0 6px 16px rgba(11,61,92,.25);
  }
  .bubble:hover{transform:translateY(-4px) scale(1.04);}
  .bubble .n{font-family:var(--font-display);font-weight:700;line-height:1;}
  .bubble .l{font-size:10px;opacity:.85;margin-top:3px;text-align:center;padding:0 6px;}
  .bubble.other{background:radial-gradient(circle at 32% 28%, #5B6B73, #2c3a42 70%);}

  /* ---------- activity feed ---------- */
  .feed{display:flex;flex-direction:column;gap:0;max-height:300px;overflow-y:auto;}
  .feed-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
  .feed-item:last-child{border-bottom:none;}
  .feed-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .feed-dot.active{background:var(--ok);}
  .feed-dot.done{background:var(--teal);}
  .feed-dot.warn{background:var(--danger);}
  .feed-text{font-size:12.5px;color:var(--ink);line-height:1.4;}
  .feed-time{font-size:10.5px;color:var(--muted);margin-top:2px;}

  /* ---------- socket status bar ---------- */
  .socket-bar-wrap{margin-top:22px;}
  .socket-bar{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:10px 0;}
  .socket-legend{display:flex;gap:22px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .socket-legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;}

  /* ---------- charts ---------- */
  .chart-card{margin-bottom:20px;}
  .bench-row{display:flex;align-items:center;gap:14px;margin:14px 0;}
  .bench-name{width:110px;font-size:12.5px;font-weight:700;color:var(--ink);flex-shrink:0;}
  .bench-track{flex:1;background:var(--card2);border-radius:6px;height:26px;position:relative;overflow:hidden;}
  .bench-fill{height:100%;border-radius:6px;width:0;transition:width 1.1s cubic-bezier(.22,.9,.3,1);}
  .bench-val{width:100px;text-align:right;font-size:12px;font-weight:700;color:var(--ink);flex-shrink:0;}

  .potential-card{
    background:linear-gradient(120deg,var(--deep),var(--navy));
    border-radius:16px;color:var(--white);padding:26px 28px;margin-top:6px;
  }
  .potential-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px;}
  .potential-box .k{font-size:11.5px;color:#B9D3E0;font-weight:600;}
  .potential-box .v{font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:4px;}
  .potential-box .v.hi{color:var(--mint);}
  .potential-btn{
    margin-top:20px;background:var(--mint);color:var(--navy);border:none;
    padding:11px 20px;border-radius:9px;font-weight:700;font-size:13px;
  }
  .potential-btn:hover{background:#42d6c7;}
  .potential-result{margin-top:14px;font-size:12.5px;color:#D7EAE3;display:none;}

  /* ---------- tabs (ticari modüller) ---------- */
  .tabbar{display:flex;gap:8px;margin-bottom:22px;background:var(--card2);padding:5px;border-radius:11px;width:fit-content;}
  .tab-btn{padding:9px 18px;border:none;background:transparent;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);}
  .tab-btn.active{background:var(--white);color:var(--deep);box-shadow:0 2px 6px rgba(11,61,92,.12);}
  .tabpage{display:none;}
  .tabpage.active{display:block;animation:fadeUp .3s ease;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;
    font-size:13px;font-family:inherit;color:var(--ink);background:var(--white);
  }
  .field input:focus, .field select:focus{border-color:var(--teal);}
  .btn-primary{
    background:var(--deep);color:var(--white);border:none;padding:11px 22px;
    border-radius:9px;font-weight:700;font-size:13px;
  }
  .btn-primary:hover{background:#0d4a6e;}
  .btn-ghost{
    background:transparent;color:var(--deep);border:1.5px solid var(--border);
    padding:8px 16px;border-radius:9px;font-weight:700;font-size:12.5px;
  }
  .btn-ghost:hover{border-color:var(--teal);color:var(--teal);}

  .campaign-list, .community-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px;}
  .mini-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .mini-card .t{font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:4px;}
  .mini-card .s{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
  .mini-stat-row{display:flex;justify-content:space-between;font-size:12px;color:var(--deep);font-weight:700;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;}
  .pill.on{background:rgba(46,158,109,.12);color:var(--ok);}
  .pill.pending{background:rgba(252,175,23,.15);color:#a8720a;}

  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th{text-align:left;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:2px solid var(--border);}
  td{padding:13px 12px;border-bottom:1px solid var(--border);color:var(--ink);}
  tr:hover td{background:var(--card);}
  .badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px;}
  .badge .d{width:6px;height:6px;border-radius:50%;}
  .badge.ok{background:rgba(46,158,109,.12);color:var(--ok);}
  .badge.ok .d{background:var(--ok);}
  .badge.err{background:rgba(208,72,62,.1);color:var(--danger);}
  .badge.err .d{background:var(--danger);}
  .badge.idle{background:rgba(91,107,115,.1);color:var(--muted);}
  .badge.idle .d{background:var(--muted);}
  .row-actions{display:flex;gap:8px;}
  .icon-btn{background:var(--card2);border:none;padding:7px 11px;border-radius:7px;font-size:11.5px;font-weight:700;color:var(--deep);}
  .icon-btn:hover{background:#dfeaee;}
  .search-row{display:flex;gap:12px;margin-bottom:18px;align-items:center;}
  .search-input{flex:1;max-width:340px;padding:10px 14px;border:1px solid var(--border);border-radius:9px;font-size:13px;}

  /* ---------- mobile demo ---------- */
  .mobile-wrap{display:flex;gap:52px;align-items:flex-start;justify-content:center;flex-wrap:wrap;padding-top:6px;}
  .phone-frame{
    width:300px;height:624px;background:var(--navy);border-radius:42px;
    padding:14px;box-shadow:0 30px 60px rgba(11,31,51,.35), 0 0 0 2px #06121f;
    position:relative;flex-shrink:0;
  }
  .phone-notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:22px;background:var(--navy);border-radius:0 0 16px 16px;z-index:5;}
  .phone-screen{
    width:100%;height:100%;background:#fff;border-radius:30px;overflow:hidden;
    position:relative;display:flex;flex-direction:column;
  }
  .phone-statusbar{height:30px;flex-shrink:0;background:#fff;}
  .phone-content{flex:1;position:relative;overflow:hidden;}
  .phone-view{
    position:absolute;inset:0;background:#fff;padding:14px 16px 0 16px;
    overflow-y:auto;
    opacity:0;transform:translateX(16px);pointer-events:none;
    transition:opacity .26s ease, transform .26s ease;
  }
  .phone-view.active{opacity:1;transform:translateX(0);pointer-events:auto;}
  .phone-bottomnav{
    height:64px;flex-shrink:0;background:#fff;
    border-top:1px solid var(--ph-border);display:flex;align-items:center;justify-content:space-around;
    padding-bottom:6px;
  }
  .pn-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:#B9B9B9;background:none;border:none;padding:6px 4px;}
  .pn-item svg{width:20px;height:20px;}
  .pn-item span{font-size:9px;font-weight:700;font-family:var(--font-rounded);}
  .pn-item.active{color:var(--ph-orange);}
  .pn-fab{position:relative;top:-14px;}
  .pn-fab .fab-circle{width:46px;height:46px;border-radius:50%;background:var(--ph-green);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(0,183,99,.4);margin-bottom:2px;}
  .pn-fab svg{width:20px;height:20px;color:#fff;}
  .pn-fab > span.lbl{opacity:0;height:0;display:block;}

  /* headers */
  .ph-h1{font-family:var(--font-rounded);font-weight:800;font-size:18px;color:#111;margin:2px 0 14px 0;letter-spacing:-.2px;}
  .ph-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px 0;}
  .ph-header .left{display:flex;align-items:center;gap:10px;}
  .ph-header .back{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#222;flex-shrink:0;background:#F5F5F5;border-radius:50%;}
  .ph-header .title{font-family:var(--font-rounded);font-weight:800;font-size:15.5px;color:#111;letter-spacing:-.2px;}
  .ph-header .iconbtn{width:32px;height:32px;border-radius:50%;background:#F5F5F5;display:flex;align-items:center;justify-content:center;color:#333;flex-shrink:0;}
  .ph-header.on-dark .back{background:rgba(255,255,255,.12);color:#fff;}
  .ph-header.on-dark .title{color:#fff;}
  .ph-header.on-dark .iconbtn{background:rgba(46,196,182,.18);color:var(--ph-green);}

  /* search / map */
  .ph-search{background:#F5F5F5;border:1px solid var(--ph-border);border-radius:12px;padding:11px 14px;font-size:12px;color:#8F8F8F;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .ph-map{
    height:220px;border-radius:16px;position:relative;overflow:hidden;margin-bottom:14px;
    background:
      radial-gradient(circle at 20% 30%, rgba(253,80,3,.06), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(28,114,147,.1), transparent 45%),
      #EDEDED;
  }
  .ph-map svg{position:absolute;inset:0;width:100%;height:100%;}
  .ph-pin{position:absolute;width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--ph-orange);transform:rotate(-45deg);border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,.25);}
  .ph-pin.me{background:#1C7293;width:16px;height:16px;}

  /* station card */
  .ph-station-card{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--ph-border);}
  .ph-station-card .name{font-weight:800;font-size:14.5px;color:#111;}
  .ph-station-card .addr{font-size:10.5px;color:#8F8F8F;margin:3px 0 8px 0;line-height:1.4;}
  .ph-rating{font-size:11px;color:#E0A800;font-weight:700;}
  .ph-taglist{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .ph-tag{font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--ph-green-bg);color:var(--ph-green-text);}
  .ph-tag.dist{background:#F0F0F0;color:#555;}

  .ph-power-info{
    background:#FBECE7;border:1px solid #F5D3C6;
    border-radius:10px;padding:11px 12px;margin:12px 0;font-size:11px;color:#8A3F1D;line-height:1.45;
    display:flex;gap:8px;align-items:flex-start;
  }

  /* tabs (Soketler / Bilgi / Rezervasyon / Son İşlemler) */
  .ph-tabs{display:flex;gap:0;border-bottom:1px solid var(--ph-border);margin:14px 0 4px 0;overflow-x:auto;scrollbar-width:none;}
  .ph-tabs::-webkit-scrollbar{display:none;}
  .ph-tab{padding:8px 3px;font-size:10.8px;font-weight:700;color:#ADADAD;border:none;background:none;
    border-bottom:2px solid transparent;white-space:nowrap;margin-right:16px;flex-shrink:0;}
  .ph-tab.active{color:#111;border-bottom-color:var(--ph-orange);}
  .ph-tabcontent{display:none;padding-top:10px;}
  .ph-tabcontent.active{display:block;}

  /* socket rows */
  .ph-socket-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ph-border);}
  .ph-socket-row:last-child{border-bottom:none;}
  .ph-socket-row .st{font-weight:700;font-size:12px;color:#111;}
  .ph-socket-row .meta{color:#9A9A9A;font-size:9.5px;margin-top:2px;}
  .ph-status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}

  /* transaction history rows (Son İşlemler) — mirrors real production screen */
  .ph-tx{padding:10px 0;border-bottom:1px solid var(--ph-border);}
  .ph-tx:last-child{border-bottom:none;}
  .ph-tx .top{display:flex;justify-content:space-between;align-items:baseline;}
  .ph-tx .veh{font-size:11.5px;font-weight:800;color:#111;}
  .ph-tx .date{font-size:9px;color:#ADADAD;}
  .ph-tx .stats{display:flex;gap:18px;margin-top:6px;}
  .ph-tx .stats div{font-size:9px;color:#ADADAD;}
  .ph-tx .stats b{color:#111;display:block;font-size:11.5px;font-weight:700;margin-bottom:1px;}

  /* buttons */
  .ph-btn-orange{width:100%;background:var(--ph-orange);color:#fff;border:none;padding:13px;border-radius:12px;font-weight:800;font-size:13.5px;margin-top:6px;}
  .ph-btn-teal{width:100%;background:var(--deep);color:#fff;border:none;padding:13px;border-radius:12px;font-weight:800;font-size:13.5px;margin-top:6px;}
  .ph-btn-outline{width:100%;background:#fff;color:var(--ph-orange);border:1.5px solid var(--ph-orange);padding:11px;border-radius:12px;font-weight:800;font-size:12.5px;}
  .ph-btn-row{display:flex;gap:8px;margin-bottom:14px;}
  .ph-btn-row .ph-btn-orange, .ph-btn-row .ph-btn-outline{margin-top:0;}

  /* socket select chips */
  .ph-socket-select{display:flex;gap:8px;margin:12px 0;}
  .ph-socket-opt{flex:1;border:1.5px solid var(--ph-border);border-radius:10px;padding:10px 6px;text-align:center;font-size:10.2px;font-weight:700;color:#9A9A9A;background:#fff;}
  .ph-socket-opt.sel{border-color:var(--ph-orange);color:#B23D00;background:#FFF3EE;}
  .ph-cost-range{text-align:center;padding:14px 0;}
  .ph-cost-range .amt{font-family:var(--font-display);font-size:26px;font-weight:700;color:#111;}
  .ph-cost-range .lbl{font-size:10.5px;color:#9A9A9A;margin-top:2px;}
  .ph-pay-row{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--ph-border);border-radius:10px;padding:11px 13px;margin-bottom:10px;font-size:12px;}

  /* İşlemler (transaction list) screen */
  .ph-sort-row{display:flex;gap:8px;margin-bottom:16px;}
  .ph-sort-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1.4px solid var(--ph-orange);color:var(--ph-orange);background:#fff;border-radius:20px;padding:9px 6px;font-size:10px;font-weight:800;font-family:var(--font-rounded);}
  .ph-sort-btn.active{background:var(--ph-orange);color:#fff;border-color:var(--ph-orange);}
  .ph-tx-card{background:#F8F9FA;border-radius:14px;padding:14px 16px 10px 16px;margin-bottom:12px;cursor:pointer;}
  .ph-tx-card .row1{display:flex;align-items:center;gap:8px;}
  .ph-tx-card .date{font-size:12.5px;font-weight:800;color:#111;}
  .ph-tx-card .time{font-size:10px;color:#9A9A9A;margin-top:2px;}
  .ph-tx-card .mid{flex:1;text-align:center;}
  .ph-tx-card .mid .lbl{font-size:9px;color:#9A9A9A;}
  .ph-tx-card .mid .amt{font-size:14.5px;font-weight:800;color:#111;margin-top:1px;}
  .ph-tx-status{background:var(--ph-green);color:#fff;font-size:10px;font-weight:800;padding:8px 13px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
  .ph-tx-expand{display:flex;justify-content:flex-end;margin-top:2px;color:#B9B9B9;}
  .ph-tx-expand svg{transition:transform .2s ease;}
  .ph-tx-detail{margin-top:8px;padding-top:8px;border-top:1px solid var(--ph-border);font-size:10.5px;color:#6B7280;}

  /* charging */
  .ph-charging{display:flex;flex-direction:column;align-items:center;padding:30px 10px;}
  .ph-ring{width:120px;height:120px;border-radius:50%;border:8px solid #F1F1F1;border-top-color:var(--ph-orange);animation:spin 1.4s linear infinite;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* vehicle cards */
  .ph-vcard{background:#fff;border:1px solid var(--ph-border);border-radius:14px;padding:13px 14px;margin-bottom:10px;}
  .ph-vcard .row1{display:flex;gap:10px;align-items:center;}
  .ph-vcard .vicon{width:36px;height:36px;border-radius:9px;background:#F5F5F5;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ph-vcard .plate{font-weight:800;font-size:12.5px;color:#111;}
  .ph-vcard .model{font-size:10.5px;color:#9A9A9A;margin-top:1px;}
  .ph-vcard .tags{display:flex;gap:6px;margin:9px 0 10px 0;}
  .ph-pill{font-size:9px;font-weight:800;padding:3px 9px;border-radius:20px;}
  .ph-pill.green{background:var(--ph-green-bg);color:var(--ph-green-text);}
  .ph-pill.blue{background:var(--ph-blue-bg);color:var(--ph-blue-text);}
  .ph-vcard .actions{display:flex;gap:8px;}
  .ph-btn-sm{flex:1;border:none;padding:8px;border-radius:9px;font-size:10.8px;font-weight:800;}
  .ph-btn-sm.pink{background:var(--ph-pink-bg);color:var(--ph-pink-text);}
  .ph-btn-sm.gray{background:var(--ph-gray-bg);color:#333;}

  /* toggle switch */
  .ph-toggle{width:34px;height:19px;background:#E4E4E4;border-radius:20px;position:relative;flex-shrink:0;}
  .ph-toggle.on{background:var(--ph-orange);}
  .ph-toggle::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;background:white;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .ph-toggle.on::after{left:17px;}

  /* form fields (Araç Ekle) */
  .ph-field{margin-bottom:12px;}
  .ph-field label{display:block;font-size:10.5px;font-weight:800;color:#333;margin-bottom:5px;}
  .ph-field .val{background:#F6F6F6;border:1px solid var(--ph-border);border-radius:10px;padding:11px 12px;font-size:12px;color:#666;}
  .ph-toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-top:1px solid var(--ph-border);border-bottom:1px solid var(--ph-border);margin:12px 0;}
  .ph-toggle-row .lbl{font-size:11.5px;font-weight:700;color:#111;}
  .ph-infobox{background:#F6F6F6;border-radius:10px;padding:12px;font-size:10px;color:#666;line-height:1.55;margin:12px 0;}
  .ph-infobox .t{font-weight:800;color:#111;margin-bottom:5px;font-size:10.8px;}

  /* account / hesap */
  .ph-profile-hero{display:flex;align-items:center;gap:12px;padding:4px 0 18px 0;}
  .ph-profile-hero .av{width:50px;height:50px;border-radius:50%;background:var(--ph-orange);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex-shrink:0;}
  .ph-profile-hero .nm{font-weight:800;font-size:14px;color:#111;}
  .ph-profile-hero .em{font-size:10.5px;color:#9A9A9A;margin-top:1px;}
  .ph-menu-row{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid var(--ph-border);font-size:12.5px;font-weight:700;color:#111;}
  .ph-menu-row .chev{color:#C9C9C9;}

  /* rota (route) dark card — mirrors real production screen */
  .ph-route-card{background:var(--ph-dark);border-radius:20px;padding:36px 22px;text-align:center;color:white;margin-top:8px;}
  .ph-route-card .logo-circle{width:54px;height:54px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;margin:0 auto 18px auto;}
  .ph-route-card h3{font-family:var(--font-display);font-size:19px;margin:0 0 10px 0;font-weight:700;}
  .ph-route-card p{font-size:11.5px;color:#B8B8B8;line-height:1.55;margin:0 0 22px 0;}
  .ph-route-btn{background:#4CD787;color:#0B3D2A;border:none;padding:13px 20px;border-radius:12px;font-weight:800;font-size:12.5px;width:100%;}

  /* topluluk */
  .ph-community-hero{text-align:center;padding:22px 10px 16px 10px;}
  .ph-community-hero .ic{width:60px;height:60px;border-radius:50%;background:#FBECE7;display:flex;align-items:center;justify-content:center;margin:0 auto 14px auto;}
  .ph-leader-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--ph-border);border-radius:10px;padding:9px 12px;margin-bottom:8px;}
  .ph-leader-rank{width:20px;height:20px;border-radius:50%;background:#F0F0F0;color:#9A9A9A;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ph-leader-rank.g1{background:var(--ph-orange);color:white;}

  /* ---- QR scan screen ---- */
  .ph-qr-hint{font-family:var(--font-rounded);font-weight:800;font-size:13.5px;color:#fff;text-align:center;margin-top:22px;line-height:1.4;padding:0 10px;}
  .ph-qr-subhint{font-size:10.5px;color:#F8C24A;text-align:center;margin-top:6px;}
  .ph-qr-frame{width:210px;height:210px;margin:14px auto 0 auto;position:relative;background:#000;border-radius:8px;overflow:hidden;cursor:pointer;}
  .ph-qr-frame .corner{position:absolute;width:26px;height:26px;border:3px solid var(--ph-green);}
  .ph-qr-frame .corner.tl{top:8px;left:8px;border-right:none;border-bottom:none;}
  .ph-qr-frame .corner.tr{top:8px;right:8px;border-left:none;border-bottom:none;}
  .ph-qr-frame .corner.bl{bottom:8px;left:8px;border-right:none;border-top:none;}
  .ph-qr-frame .corner.br{bottom:8px;right:8px;border-left:none;border-top:none;}
  .ph-qr-scanline{position:absolute;left:8px;right:8px;height:2px;background:var(--ph-green);box-shadow:0 0 8px var(--ph-green);animation:scanmove 2.2s ease-in-out infinite;}
  @keyframes scanmove{0%{top:14%;}50%{top:82%;}100%{top:14%;}}
  .ph-manual-btn{width:100%;background:var(--ph-green-bg);color:var(--ph-green-text);border:none;padding:14px;border-radius:14px;font-weight:800;font-size:13px;font-family:var(--font-rounded);margin-top:auto;}

  /* ---- Şarj Başlatılıyor (countdown ring via SVG) ---- */
  .ph-countdown-wrap{display:flex;flex-direction:column;align-items:center;padding-top:40px;text-align:center;}
  .ph-countdown-ring{position:relative;width:180px;height:180px;margin:26px auto 0 auto;}
  .ph-countdown-ring svg{transform:rotate(-90deg);}
  .ph-countdown-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-rounded);font-weight:800;font-size:34px;color:#111;}
  .ph-countdown-num span{font-size:14px;font-weight:700;color:#9A9A9A;margin-left:2px;}

  /* ---- Şarj (rich charging screen) ---- */
  .ph-idpill{display:inline-flex;align-items:center;gap:7px;background:var(--ph-green-bg);color:var(--ph-green-text);border-radius:20px;padding:8px 14px;font-size:11.5px;font-weight:700;margin-bottom:12px;}
  .ph-info2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .ph-info2col .box{background:#F7F7F7;border-radius:10px;padding:9px 11px;}
  .ph-info2col .box .l{font-size:9.5px;color:#9A9A9A;margin-bottom:3px;}
  .ph-info2col .box .v{font-size:13px;font-weight:800;color:#111;}
  .ph-info2col .box .v span{font-size:10px;color:#9A9A9A;font-weight:600;}
  .ph-dark-card{background:var(--ph-dark);border-radius:14px;padding:14px 16px;margin-top:14px;display:flex;align-items:center;gap:12px;}
  .ph-dark-card .icn{width:34px;height:34px;border-radius:9px;background:rgba(0,183,99,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ph-dark-card .mid{flex:1;}
  .ph-dark-card .mid .t{color:#fff;font-weight:700;font-size:12px;font-family:var(--font-rounded);}
  .ph-dark-card .mid .bar{height:4px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:7px;overflow:hidden;}
  .ph-dark-card .mid .bar i{display:block;height:100%;background:var(--ph-green);border-radius:3px;}
  .ph-dark-card .val{text-align:right;flex-shrink:0;}
  .ph-dark-card .val b{color:#fff;font-size:15px;font-weight:800;}
  .ph-dark-card .val small{color:#9A9A9A;font-size:9px;display:block;}
  .ph-battery-card{background:#fff;border:1px solid var(--ph-border);border-radius:14px;padding:14px 16px;margin-top:12px;}
  .ph-battery-card .top{display:flex;justify-content:space-between;font-size:11px;color:#9A9A9A;font-weight:700;margin-bottom:8px;}
  .ph-battery-card .top b{color:#111;font-size:13px;}
  .ph-battery-bar{height:8px;background:#EFEFEF;border-radius:6px;overflow:hidden;}
  .ph-battery-bar i{display:block;height:100%;background:var(--ph-green);border-radius:6px;}
  .ph-stat2col{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:14px;text-align:center;}
  .ph-stat2col .s{padding:4px 0;}
  .ph-stat2col .s:first-child{border-right:1px solid var(--ph-border);}
  .ph-stat2col .s b{display:block;font-family:var(--font-rounded);font-size:17px;font-weight:800;color:#111;}
  .ph-stat2col .s span{font-size:9.5px;color:#9A9A9A;}
  .ph-values-card{background:#fff;border:1px solid var(--ph-border);border-radius:14px;padding:6px 16px;margin-top:12px;}
  .ph-values-card .lbl{font-size:9.5px;color:#9A9A9A;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding-top:10px;}
  .ph-vrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ph-border);font-size:12px;}
  .ph-vrow:last-child{border-bottom:none;}
  .ph-vrow .l{color:#9A9A9A;font-weight:600;}
  .ph-vrow .v{font-weight:800;color:#111;}
  .ph-vrow .v span{font-size:9.5px;color:#9A9A9A;font-weight:600;}
  .ph-btn-green{width:100%;background:var(--ph-green);color:#fff;border:none;padding:14px;border-radius:13px;font-weight:800;font-size:13.5px;font-family:var(--font-rounded);margin-top:14px;}

  /* ---- İşlem Detayı ---- */
  .ph-section-lbl{font-size:10px;color:#9A9A9A;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 8px 2px;}
  .ph-kv-card{background:#fff;border:1px solid var(--ph-border);border-radius:14px;padding:4px 14px;}
  .ph-kv-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ph-border);font-size:11.5px;}
  .ph-kv-row:last-child{border-bottom:none;}
  .ph-kv-row .k{color:#9A9A9A;font-weight:600;}
  .ph-kv-row .v{font-weight:800;color:#111;text-align:right;}
  .ph-kv-row .v.accent{color:var(--ph-green-text);}
  .ph-status-badge{background:var(--ph-green-bg);color:var(--ph-green-text);font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
  .ph-status-badge .d{width:6px;height:6px;border-radius:50%;background:var(--ph-green-text);}

  /* ---- İşlem Grafiği ---- */
  .ph-graph-tabs{display:flex;background:#F2F2F2;border-radius:20px;padding:4px;margin-bottom:14px;}
  .ph-graph-tab{flex:1;text-align:center;padding:8px 2px;border-radius:16px;font-size:9.5px;font-weight:700;color:#9A9A9A;background:none;border:none;font-family:var(--font-rounded);white-space:nowrap;}
  .ph-graph-tab.active{background:var(--ph-green);color:#fff;}
  .ph-graph-caption{font-size:10px;color:#4A90D9;margin-top:6px;text-align:left;}

  /* ---- Bakiye Hareketlerim (wallet/balance) ---- */
  .ph-balance-card{background:linear-gradient(135deg,#00C46E,#00A659);border-radius:16px;padding:18px 18px 16px 18px;color:#fff;}
  .ph-balance-card .row{display:flex;justify-content:space-between;margin-bottom:10px;}
  .ph-balance-card .row .lbl{font-size:10.5px;opacity:.85;}
  .ph-balance-card .row .val{font-family:var(--font-rounded);font-size:21px;font-weight:800;margin-top:3px;}
  .ph-balance-card .track{height:6px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;margin:8px 0 10px 0;}
  .ph-balance-card .track i{display:block;height:100%;background:#fff;border-radius:4px;}
  .ph-balance-card .tag{font-size:10px;opacity:.9;}
  .ph-tx-row{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--ph-border);}
  .ph-tx-row:last-child{border-bottom:none;}
  .ph-tx-icon{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .ph-tx-row .info{flex:1;}
  .ph-tx-row .t{font-size:12px;font-weight:700;color:#111;}
  .ph-tx-row .d{font-size:9.5px;color:#9A9A9A;margin-top:1px;}
  .ph-tx-row .amt{text-align:right;flex-shrink:0;}
  .ph-tx-row .amt b{font-size:12.5px;font-weight:800;}
  .ph-tx-row .amt b.pos{color:var(--ph-green-text);}
  .ph-tx-row .amt b.neg{color:var(--ph-pink-text);}
  .ph-tx-row .amt .k{font-size:9px;color:#9A9A9A;margin-top:1px;}

  .callouts{display:flex;flex-direction:column;gap:16px;max-width:290px;padding-top:34px;}
  .callout{display:flex;gap:12px;}
  .callout .num{width:26px;height:26px;border-radius:50%;background:var(--deep);color:white;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .callout .txt{font-size:12.5px;color:var(--ink);line-height:1.45;}
  .callout .txt b{color:var(--deep);}


  .toast{
    position:fixed;bottom:28px;right:28px;background:var(--navy);color:white;
    padding:14px 20px;border-radius:11px;font-size:13px;font-weight:600;
    box-shadow:0 12px 28px rgba(0,0,0,.25);
    display:flex;align-items:center;gap:10px;
    transform:translateY(20px);opacity:0;pointer-events:none;
    transition:transform .3s ease, opacity .3s ease;
    z-index:999;
  }
  .toast.show{transform:translateY(0);opacity:1;}
  .toast .tdot{width:8px;height:8px;border-radius:50%;background:var(--mint);}

  @media (max-width:980px){
    .sidebar{transform:translateX(-100%);}
    .main{margin-left:0;padding:26px 18px 60px 18px;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .grid-60-40{grid-template-columns:1fr;}
    .campaign-list,.community-list{grid-template-columns:1fr;}
    .mobile-wrap{flex-direction:column;align-items:center;}
    .callouts{max-width:300px;padding-top:10px;}
  }  /* ============================================================
     EMBEDDED ADMIN PANEL (real Doldur/ovolt management console)
     ============================================================ */
  .admin-frame{
    --adm-blue:#0D6EFD; --adm-blue-bg:#EFF6FF;
    --adm-green:#198754; --adm-green-bg:#D1F2E1;
    --adm-border:#E5E7EB; --adm-text:#1F2937; --adm-muted:#6B7280;
    --adm-sidebar-bg:#F8F9FA;
    background:#fff; border-radius:14px; overflow:hidden;
    border:1px solid #dfe3e8; box-shadow:0 18px 40px rgba(20,30,40,.12);
    font-family:'Segoe UI', Helvetica, Arial, sans-serif;
    color:var(--adm-text);
  }
  .admin-chrome{
    background:#EDEFF2; padding:10px 14px; display:flex; align-items:center; gap:7px;
    border-bottom:1px solid var(--adm-border);
  }
  .admin-chrome .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .admin-chrome .dot.r{background:#FF5F57;} .admin-chrome .dot.y{background:#FEBC2E;} .admin-chrome .dot.g{background:#28C840;}
  .admin-url{margin:0 auto;background:#fff;border:1px solid var(--adm-border);border-radius:20px;padding:4px 16px;font-size:11.5px;color:#8A93A0;}
  .admin-topbar{
    display:flex; align-items:center; gap:14px; padding:12px 20px;
    border-bottom:1px solid var(--adm-border); background:#fff;
  }
  .admin-hamburger{background:none;border:none;color:#4B5563;cursor:pointer;padding:4px;}
  .admin-crumb{font-size:16px;font-weight:700;color:var(--adm-text);}
  .admin-crumb .code{color:#9CA3AF;font-weight:600;font-size:13px;margin-right:6px;}
  .admin-top-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .admin-flag-btn{width:26px;height:26px;border-radius:50%;background:#E63946;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .admin-icon-btn{width:32px;height:32px;border-radius:50%;background:#F3F4F6;border:none;color:#4B5563;display:flex;align-items:center;justify-content:center;}
  .admin-support-btn{display:flex;align-items:center;gap:7px;background:#F3F4F6;border:none;border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--adm-text);}

  .admin-body{display:flex;min-height:560px;max-height:560px;}
  .admin-sidebar{
    width:230px;flex-shrink:0;background:var(--adm-sidebar-bg);border-right:1px solid var(--adm-border);
    padding:14px 10px;overflow-y:auto;transition:width .2s ease, padding .2s ease, opacity .2s ease;
  }
  .admin-sidebar.collapsed{width:0;padding:14px 0;opacity:0;overflow:hidden;}
  .admin-brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:var(--adm-text);padding:4px 8px 14px 8px;}
  .admin-brand .logo-box{width:26px;height:26px;border-radius:7px;background:var(--ph-orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .admin-nav-link{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
    padding:9px 10px;border-radius:8px;font-size:12.8px;font-weight:600;color:#4B5563;margin-bottom:2px;
  }
  .admin-nav-link:hover{background:#F0F1F3;}
  .admin-nav-link.active{background:var(--adm-blue-bg);color:var(--adm-blue);font-weight:700;}
  .admin-nav-group-toggle{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
    padding:9px 10px;border-radius:8px;font-size:12.8px;font-weight:700;color:#374151;
  }
  .admin-nav-group-toggle:hover{background:#F0F1F3;}
  .admin-nav-group-toggle .chev{margin-left:auto;transition:transform .18s ease;color:#9CA3AF;}
  .admin-nav-group-toggle.open .chev{transform:rotate(180deg);}
  .admin-nav-children{max-height:0;overflow:hidden;padding-left:14px;transition:max-height .22s ease;}
  .admin-nav-children.open{max-height:400px;}
  .admin-nav-subgroup-toggle{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;
    padding:8px 10px;font-size:12.3px;font-weight:600;color:#4B5563;
  }
  .admin-nav-subgroup-toggle .chev{margin-left:auto;color:#9CA3AF;transition:transform .18s ease;}
  .admin-nav-subgroup-toggle.open .chev{transform:rotate(180deg);}
  .admin-nav-subchildren{max-height:0;overflow:hidden;padding-left:14px;transition:max-height .2s ease;}
  .admin-nav-subchildren.open{max-height:200px;}

  .admin-content{flex:1;overflow-y:auto;padding:20px 22px;background:#fff;}
  .admin-page{display:none;}
  .admin-page.active{display:block;animation:fadeUp .3s ease;}

  .adm-stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .adm-stat-row.six{grid-template-columns:repeat(3,1fr);}
  .adm-stat{background:#fff;border:1px solid var(--adm-border);border-radius:10px;padding:14px 16px;position:relative;}
  .adm-stat.wide{display:flex;align-items:center;gap:10px;padding:11px 14px;}
  .adm-stat .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;flex-shrink:0;}
  .adm-stat.wide .ic{margin-bottom:0;}
  .adm-stat .ic.purple{background:#EDEBFE;color:#7C6EF0;}
  .adm-stat .ic.green{background:#E8F9F0;color:#1FAE72;}
  .adm-stat .ic.yellow{background:#FFF8E1;color:#D9A404;}
  .adm-stat .ic.pink{background:#FCE8FF;color:#C24FD6;}
  .adm-stat .ic.blue{background:#E8F1FF;color:#0D6EFD;}
  .adm-stat .ic.teal{background:#E3FBF7;color:#12A594;}
  .adm-stat .ic.red{background:#FDECEC;color:#E5484D;}
  .adm-stat .ic.gray{background:#F3F4F6;color:#6B7280;}
  .adm-stat .t{font-size:11.5px;color:var(--adm-muted);font-weight:600;margin-bottom:4px;}
  .adm-stat.wide .t{flex:1;margin-bottom:0;}
  .adm-stat .v{font-size:19px;font-weight:800;color:var(--adm-text);}
  .adm-stat .v .up{font-size:11px;color:#1FAE72;font-weight:700;margin-left:4px;}
  .adm-stat .v .down{font-size:11px;color:#E5484D;font-weight:700;margin-left:4px;}

  .adm-two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:18px;align-items:start;}
  .adm-stat-stack{display:flex;flex-direction:column;gap:10px;}
  .adm-card{background:#fff;border:1px solid var(--adm-border);border-radius:12px;padding:18px 20px;margin-bottom:18px;}
  .adm-card-title{font-size:14px;font-weight:700;color:var(--adm-text);}
  .adm-card-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .adm-infra-row{display:flex;gap:36px;padding:10px 0 16px 0;border-bottom:1px solid var(--adm-border);margin-bottom:14px;}
  .adm-infra-row .lbl{font-size:11.5px;color:var(--adm-muted);margin-bottom:4px;}
  .adm-infra-row .big{font-size:22px;font-weight:800;color:var(--adm-text);}
  .adm-power-hdr{font-size:12.5px;color:var(--adm-text);margin-bottom:10px;}
  .adm-power-hdr b{font-size:15px;}
  .adm-power-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .adm-power-lbl{font-size:11.5px;font-weight:700;color:var(--adm-text);margin-bottom:8px;}
  .adm-power-lbl .fr{float:right;font-weight:700;color:var(--adm-muted);font-size:11px;}
  .adm-power-bar-row{display:flex;align-items:center;gap:8px;font-size:9.5px;color:var(--adm-muted);margin-bottom:8px;}
  .adm-power-bar-row span:first-child{width:44px;flex-shrink:0;}
  .adm-power-bar-row span:last-child{width:24px;text-align:right;flex-shrink:0;font-weight:700;color:var(--adm-text);}
  .adm-power-bar-row .track{flex:1;height:6px;background:#F0F1F3;border-radius:4px;overflow:hidden;}
  .adm-power-bar-row .track i{display:block;height:100%;border-radius:4px;}
  .adm-toggle-pill{display:flex;background:#F0F1F3;border-radius:20px;padding:3px;font-size:10px;font-weight:700;}
  .adm-toggle-pill span{padding:6px 12px;border-radius:16px;color:#6B7280;}
  .adm-toggle-pill span.on{background:var(--adm-blue);color:#fff;}
  .adm-legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:10.5px;color:var(--adm-muted);}
  .adm-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;}

  .adm-filter-card{background:#fff;border:1px solid var(--adm-border);border-radius:12px;padding:18px 20px;margin-bottom:18px;}
  .adm-filter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;}
  .adm-filter-grid .f label{display:block;font-size:11px;color:var(--adm-muted);font-weight:600;margin-bottom:5px;}
  .adm-filter-grid .inp{border:1px solid var(--adm-border);border-radius:7px;padding:8px 12px;font-size:12.5px;color:var(--adm-text);background:#fff;}
  .adm-filter-grid .inp.muted{color:#9CA3AF;}
  .adm-filter-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  .btn-clear{background:#fff;border:1px solid var(--adm-border);color:#4B5563;font-weight:700;font-size:11.5px;padding:9px 16px;border-radius:7px;}
  .btn-list{background:var(--adm-green);border:none;color:#fff;font-weight:700;font-size:11.5px;padding:9px 18px;border-radius:7px;}
  .adm-search{display:flex;align-items:center;gap:8px;border:1px solid var(--adm-border);border-radius:20px;padding:6px 14px;color:#9CA3AF;}
  .adm-search input{border:none;outline:none;font-size:12px;width:120px;color:var(--adm-text);}

  .adm-table{width:100%;border-collapse:collapse;font-size:12px;}
  .adm-card:has(.adm-table){overflow-x:auto;}
  .adm-table th{text-align:left;font-size:10.5px;color:var(--adm-muted);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--adm-border);white-space:nowrap;}
  .adm-table td{padding:11px 10px;border-bottom:1px solid var(--adm-border);color:var(--adm-text);white-space:nowrap;}
  .adm-table td.lnk{color:var(--adm-blue);font-weight:600;}
  .pill-ok{background:var(--adm-green-bg);color:var(--adm-green);font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:20px;}

  .adm-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;}
  .adm-placeholder .t{font-size:15px;font-weight:700;color:#4B5563;margin-top:14px;}
  .adm-placeholder .s{font-size:12.5px;color:#9CA3AF;margin-top:6px;}

  .adm-filter-grid.three{grid-template-columns:1fr 1fr;}
  .adm-card-actions{display:flex;align-items:center;gap:12px;}
  .btn-new{background:var(--adm-blue);border:none;color:#fff;font-weight:700;font-size:11.5px;padding:9px 16px;border-radius:7px;white-space:nowrap;}
  .adm-table tbody tr{cursor:pointer;}
  .adm-table tbody tr:hover{background:#F9FAFB;}
  .adm-pagination{display:flex;justify-content:flex-end;font-size:11px;color:var(--adm-muted);margin-top:14px;}

  .adm-two-col.profil{grid-template-columns:280px 1fr;}
  .profil-side{text-align:center;padding:26px 18px;}
  .profil-avatar{width:64px;height:64px;border-radius:50%;background:#F3F4F6;display:flex;align-items:center;justify-content:center;margin:0 auto 12px auto;}
  .profil-name{font-size:14.5px;font-weight:700;color:var(--adm-text);}
  .profil-meta{font-size:11px;color:var(--adm-muted);margin-top:2px;}
  .profil-tabs{display:flex;flex-direction:column;gap:2px;margin-top:22px;text-align:left;}
  .ptab, .ctab{background:none;border:none;text-align:left;padding:10px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:#4B5563;}
  .ptab.active, .ctab.active{background:var(--adm-blue-bg);color:var(--adm-blue);}
  .ptab:hover, .ctab:hover{background:#F3F4F6;}
  .profil-main{text-align:left;}
  .adm-section-lbl{font-size:11.5px;font-weight:800;color:var(--adm-text);text-transform:none;margin:22px 0 12px 0;padding-top:16px;border-top:1px solid var(--adm-border);}
  .adm-action-list{display:flex;flex-direction:column;}
  .adm-action-row{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--adm-border);font-size:12.5px;color:var(--adm-text);font-weight:600;}
  .adm-action-row span{color:#9CA3AF;}
  .adm-action-row:hover{color:var(--adm-blue);}
  .adm-x{color:#E5484D;font-weight:800;text-align:center !important;}
  .adm-ok{color:#1FAE72;font-weight:800;text-align:center !important;}
  .pill-pending{background:#FFF3D6;color:#B7791F;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:20px;}
  .pill-pending .d{width:6px;height:6px;border-radius:50%;background:#B7791F;display:inline-block;margin-right:5px;}

  .ctabcontent{display:none;}
  .ctabcontent.active{display:block;animation:fadeUp .25s ease;}

  /* ============ ANASAYFA VİZYON GRID (6 bölüm) ============ */
  .vision-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  .vision-card{background:#fff;border:1px solid var(--adm-border);border-radius:12px;padding:16px 18px;}
  .vh{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .vtag{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;}
  .vtag.teal{background:#12A594;} .vtag.red{background:#E5484D;} .vtag.purple{background:#7C6EF0;}
  .vtag.blue{background:#0D6EFD;} .vtag.orange{background:var(--ph-orange);} .vtag.green{background:#1FAE72;}
  .vtitle{font-size:13.5px;font-weight:800;color:var(--adm-text);}
  .vsub{font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase;letter-spacing:.3px;margin:4px 0 10px 0;}

  .vision-mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .vstat{background:#F8F9FA;border-radius:9px;padding:9px 10px;}
  .vstat.warn{background:#FFF3F2;} .vstat.ok{background:#EAFBF3;}
  .vstat .l{font-size:9px;color:#6B7280;font-weight:700;margin-bottom:3px;white-space:nowrap;}
  .vstat .v{font-size:15px;font-weight:800;color:var(--adm-text);}
  .vstat .d{font-size:9px;font-weight:700;margin-top:2px;}
  .vstat .d.up{color:#1FAE72;} .vstat .d.flat{color:#9CA3AF;}

  .valert-feed{display:flex;flex-direction:column;gap:0;margin-bottom:12px;border:1px solid var(--adm-border);border-radius:9px;padding:2px 12px;}
  .valert-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--adm-border);font-size:11px;color:var(--adm-text);}
  .valert-row:last-child{border-bottom:none;}
  .valert-row .tm{color:#9CA3AF;font-size:10px;flex-shrink:0;}
  .valert-row .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;flex-shrink:0;}
  .valert-row .dot.red{background:#E5484D;} .valert-row .dot.amber{background:#F59E0B;}

  .vbtn{border:none;border-radius:8px;font-weight:700;font-size:11.5px;padding:10px 14px;width:100%;}
  .vbtn.danger{background:#FDECEC;color:#E5484D;}
  .vbtn.purple{background:#EDEBFE;color:#6C5CE7;}
  .vbtn.blue{background:#0D6EFD;color:#fff;}
  .vbtn.orange{background:var(--ph-orange);color:#fff;}
  .vbtn.green{background:#1FAE72;color:#fff;}
  .vbtn.ghost{background:#fff;border:1.4px solid var(--adm-border);color:#374151;}
  .vbtn.sm{font-size:10.5px;padding:8px 10px;}
  .vbtn-row{display:flex;gap:8px;margin-top:12px;}
  .vbtn-row .vbtn{width:auto;flex:1;}

  .roi-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px;}
  .roi-grid.two{grid-template-columns:1fr;}
  .roi-grid .f label{display:block;font-size:10px;color:#6B7280;font-weight:700;margin-bottom:5px;}
  .roi-grid .inp{border:1px solid var(--adm-border);border-radius:7px;padding:8px 10px;font-size:11.5px;}
  .roi-grid .inp input{border:none;outline:none;width:100%;font-size:11.5px;font-family:inherit;color:var(--adm-text);}
  .roi-grid .inp.muted{color:#9CA3AF;}
  .roi-result{display:flex;gap:24px;background:#F8F9FA;border-radius:9px;padding:12px 16px;margin-bottom:12px;}
  .roi-result .l{font-size:10px;color:#6B7280;font-weight:700;margin-bottom:3px;}
  .roi-result .v{font-size:16px;font-weight:800;color:var(--adm-text);}
  .roi-result .v.accent{color:#6C5CE7;}

  .rank-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .rank-hdr{font-size:10.5px;font-weight:800;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid;}
  .rank-hdr.good{color:#1FAE72;border-color:#1FAE72;}
  .rank-hdr.bad{color:#E5484D;border-color:#E5484D;}
  .rank-row{display:flex;justify-content:space-between;font-size:10.8px;color:var(--adm-text);padding:6px 0;border-bottom:1px solid #F3F4F6;}
  .rank-row b{font-weight:700;}

  .api-key-box{display:flex;justify-content:space-between;align-items:center;background:#0B1F33;color:#7FE6C6;border-radius:8px;padding:10px 12px;margin-top:10px;font-family:monospace;font-size:11px;}
  .api-key-box button{background:rgba(46,196,182,.2);color:#7FE6C6;border:none;border-radius:6px;padding:5px 10px;font-size:10px;font-weight:700;font-family:inherit;}

  .integ-list{display:flex;flex-direction:column;gap:8px;}
  .integ-row{display:flex;align-items:center;gap:10px;border:1px solid var(--adm-border);border-radius:9px;padding:8px 10px;}
  .integ-ic{width:34px;height:20px;border-radius:5px;background:#EFF6FF;color:#0D6EFD;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .integ-row .t{font-size:11px;font-weight:700;color:var(--adm-text);}
  .integ-row .s{font-size:9.5px;color:#9CA3AF;}
  .integ-row{position:relative;}
  .integ-row .pill-ok{margin-left:auto;}

  .adm-table.compact th, .adm-table.compact td{padding:7px 8px;font-size:11px;}
  .crm-btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}

  .vision-card.span-tall{grid-row:span 1;}

  /* ============ SAHA YÖNETİMİ (pipeline) ============ */
  .saha-sub{font-size:12.5px;color:var(--adm-muted);margin:6px 0 20px 0;max-width:720px;line-height:1.5;}
  .saha-stepper{display:flex;align-items:center;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;}
  .saha-step{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:#F8F9FA;border:1.5px solid transparent;border-radius:12px;padding:14px 12px;width:132px;color:#6B7280;}
  .saha-step .sn{width:20px;height:20px;border-radius:50%;background:#E5E7EB;color:#6B7280;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .saha-step .st{font-size:10.5px;font-weight:700;text-align:center;line-height:1.25;color:#374151;}
  .saha-step.active{background:var(--adm-blue-bg);border-color:var(--adm-blue);}
  .saha-step.active .sn{background:var(--adm-blue);color:#fff;}
  .saha-step.active .st{color:var(--adm-blue);}
  .saha-step:hover{background:#F0F1F3;}
  .saha-arrow{flex-shrink:0;}
  .saha-detail{background:#F8F9FA;border-radius:10px;padding:14px 18px;}
  .sd-title{font-size:12.5px;font-weight:800;color:var(--adm-text);margin-bottom:6px;}
  .sd-body{font-size:12px;color:#4B5563;line-height:1.55;}

  .mini-prog{width:100px;height:6px;background:#EEF0F2;border-radius:4px;overflow:hidden;}
  .mini-prog i{display:block;height:100%;background:var(--adm-blue);border-radius:4px;}
  .pill-live{background:#E8F1FF;color:#0D6EFD;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;}
  .pill-live .d{width:6px;height:6px;border-radius:50%;background:#0D6EFD;animation:pulse 1.6s infinite;}
  .pill-err{background:#FDECEC;color:#E5484D;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:20px;}

  /* İhlal-Davranış modülü */
  .tier-list{display:flex;flex-direction:column;gap:8px;}
  .tier-row{display:flex;align-items:center;gap:10px;background:#F8F9FA;border-radius:9px;padding:9px 12px;}
  .tier-row .tl{flex:1;font-size:10.5px;color:#6B7280;}
  .tier-row b{font-size:11px;color:var(--adm-text);}
  .tier-badge{font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px;width:52px;text-align:center;}
  .tier-badge.bronze{background:#F3DFC8;color:#9C6A2E;}
  .tier-badge.silver{background:#E3E6EA;color:#5A6472;}
  .tier-badge.gold{background:#FCEBB6;color:#966B10;}
  .tier-badge.plat{background:#DDEBFC;color:#2C6FA8;}
  .badge-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
  .mini-badge{display:inline-flex;align-items:center;gap:5px;background:#F8F9FA;border:1px solid var(--adm-border);border-radius:20px;padding:5px 11px;font-size:10px;font-weight:700;color:#4B5563;}
  .camp-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .camp-row{display:flex;justify-content:space-between;align-items:center;background:#F8F9FA;border-radius:9px;padding:9px 12px;}
  .camp-row .t{font-size:11px;font-weight:700;color:var(--adm-text);}
  .camp-row .s{font-size:9.5px;color:#9CA3AF;}
  .camp-row b{font-size:11px;color:var(--adm-text);flex-shrink:0;margin-left:10px;}

  @media (max-width:1100px){
    .vision-grid{grid-template-columns:1fr;}
    .rank-cols{grid-template-columns:1fr;}
    .roi-grid{grid-template-columns:1fr;}
  }

  @media (max-width:980px){
    .admin-body{max-height:none;}
    .adm-two-col{grid-template-columns:1fr;}
    .adm-power-cols{grid-template-columns:1fr;}
    .adm-filter-grid{grid-template-columns:1fr 1fr;}
  }
  /* ============ ISTATISTIKLER ============ */
  .stat-hero{
    position:relative;overflow:hidden;border-radius:20px;
    background:linear-gradient(120deg,#062040 0%,#0078FE 140%);
    padding:52px 46px;
  }
  .stat-hero-glow{position:absolute;top:-80px;right:-60px;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none;}
  .stat-hero-grid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:36px 28px;}
  .shg-item .v{font-family:var(--font-display);font-size:34px;font-weight:800;color:#fff;line-height:1;}
  .shg-item .l{font-size:12.5px;color:rgba(255,255,255,.85);font-weight:600;margin-top:8px;line-height:1.35;}
  @media (max-width:980px){ .stat-hero-grid{grid-template-columns:repeat(2,1fr);} }

  /* ============ REFERANSLAR & PARTNERLER ============ */
  .ref-placeholder{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:80px 20px;text-align:center;
    border:2px dashed #D7DEE5;border-radius:18px;background:#F8F9FA;
